services:
  - type: web
    name: makingmagicmeetups-app
    env: node
    plan: free
    rootDir: basic-website-new
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true

  - type: web
    name: makingmagicmeetups-api
    env: node
    plan: free
    rootDir: making-magic-meetups
    buildCommand: npm install
    startCommand: npm run start:server
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: FRONTEND_ORIGIN
        value: https://dcp6.github.io,https://www.makingmagicmeetups.com
      - key: DATA_DIR
        value: /var/data
